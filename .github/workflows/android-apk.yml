name: Build Nexora Narrator Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'bootstrap.js'
      - 'studio.js'
      - 'api/**'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run prepare:www
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Nexora-Narrator-v2.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Nexora-Narrator-v2.0-APK
          path: Nexora-Narrator-v2.0-debug.apk
          retention-days: 30
      - name: Commit APK into repository
        run: |
          mkdir -p apk
          cp Nexora-Narrator-v2.0-debug.apk apk/Nexora-Narrator-v2.0-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Nexora-Narrator-v2.0-debug.apk
          git commit -m "Add Nexora Narrator v2.0 APK build ${GITHUB_RUN_NUMBER}" || exit 0
          git push
