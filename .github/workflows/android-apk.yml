name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'bootstrap.js'
      - 'script-auto.js'
      - 'app.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: npm run prepare:www

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Nexora-Video-AI-v1.7-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Video-AI-v1.7-APK
          path: Nexora-Video-AI-v1.7-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.7-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Nexora-Video-AI-v1.7-debug.apk --title "Nexora Video AI v1.7 APK build ${GITHUB_RUN_NUMBER}" --notes "Automated Android debug APK build for Nexora Video AI v1.7 with Auto Generate Script."

      - name: Commit APK into repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p apk
          cp Nexora-Video-AI-v1.7-debug.apk apk/Nexora-Video-AI-v1.7-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Nexora-Video-AI-v1.7-debug.apk
          git commit -m "Add Android APK v1.7 build ${GITHUB_RUN_NUMBER}" || exit 0
          git push
