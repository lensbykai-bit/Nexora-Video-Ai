name: Build Nexora Dub.Ai Windows v3.1 Clean

on:
  push:
    branches: [windows-redesign-v3]
    paths:
      - 'windows-v3/**'
      - '.github/workflows/windows-v3-build.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-v3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build clean Windows folder
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win:clean

      - name: Create clean ZIP and checksums
        shell: pwsh
        run: |
          $zip = "Nexora-Dub-Ai-Plus-v3.1-Windows-Clean.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath $zip -CompressionLevel Optimal
          $exe = "dist/win-unpacked/Nexora Dub.Ai Plus.exe"
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash
          @(
            "Nexora Dub.Ai Plus v3.1 Windows Clean Build",
            "",
            "SHA256  Nexora Dub.Ai Plus.exe",
            $exeHash,
            "",
            "SHA256  $zip",
            $zipHash,
            "",
            "This package is an unpacked Electron desktop build. It does not use an NSIS portable/self-extracting wrapper."
          ) | Set-Content -Path "CHECKSUMS-SHA256.txt" -Encoding UTF8

      - name: Show output
        run: |
          Get-ChildItem -Path dist/win-unpacked -Recurse | Select-Object FullName,Length
          Get-Item Nexora-Dub-Ai-Plus-v3.1-Windows-Clean.zip | Select-Object FullName,Length
          Get-Content CHECKSUMS-SHA256.txt

      - name: Upload Windows clean package
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Dub-Ai-Plus-Windows-v3.1-Clean
          path: |
            windows-v3/Nexora-Dub-Ai-Plus-v3.1-Windows-Clean.zip
            windows-v3/CHECKSUMS-SHA256.txt
          if-no-files-found: error
          retention-days: 30
