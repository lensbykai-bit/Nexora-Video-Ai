<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <title>Nexora Narrator</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="studio">
    <header class="studio-head">
      <div>
        <span class="kicker">PRIVATE VIDEO NARRATOR</span>
        <h1>Nexora Narrator</h1>
      </div>
      <span class="pill">NEW v2.0</span>
    </header>

    <section class="viewer" id="viewer">
      <div class="empty-view" id="emptyView">
        <div class="upload-icon">＋</div>
        <strong>Choose your video</strong>
        <span>AI will watch it and write narration for you</span>
        <label class="choose-btn" for="videoFile">Select Video</label>
        <input id="videoFile" type="file" accept="video/*" hidden />
      </div>
    </section>

    <section class="control-dock">
      <div class="progress-line">
        <span class="dot active"></span><span></span><span class="dot"></span><span></span><span class="dot"></span><span></span><span class="dot"></span>
      </div>
      <div class="status-line" id="statusLine">No video selected</div>

      <div class="action-grid">
        <button id="analyzeBtn" class="big-action" disabled>
          <b>01</b><span>Analyze Video</span><small>AI understands the scene</small>
        </button>
        <button id="voiceBtn" class="big-action" disabled>
          <b>02</b><span>Adam Voice</span><small>Generate narration</small>
        </button>
      </div>

      <div class="editor-panel">
        <div class="panel-head"><strong>Narration Script</strong><button id="rewriteBtn" class="ghost" disabled>Rewrite</button></div>
        <textarea id="scriptEditor" placeholder="Your AI narration will appear here..."></textarea>
      </div>

      <div class="language-row">
        <div><label>Language</label><select id="targetLanguage"><option>English</option><option>Khmer</option><option>Chinese</option><option>French</option><option>Spanish</option><option>German</option><option>Japanese</option><option>Korean</option><option>Thai</option><option>Vietnamese</option></select></div>
        <div><label>Subtitle</label><select id="subtitleMode"><option value="on">On</option><option value="off">Off</option></select></div>
      </div>

      <button id="exportBtn" class="export-btn" disabled>Export Final MP4</button>
      <div class="mini-note">Personal use only · Your video stays under your control.</div>
    </section>
  </div>
  <script src="bootstrap.js"></script>
  <script src="studio.js"></script>
</body>
</html>
